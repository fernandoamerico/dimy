# .goreleaser.yaml
# Configuration for GoReleaser

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0 # Keep CGO disabled to allow easy cross-compilation
    goos:
      - linux
    goarch:
      - amd64
    main: ./main.go
    binary: dimy
    ldflags:
      - -X github.com/fernandoamerico/dimy/version.Version={{.Tag}}

archives:
  - format: tar.gz
    # use zip for windows archives
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
