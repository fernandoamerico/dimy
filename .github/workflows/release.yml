name: Release Dimy

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # Trigger build when a tag starting with 'v' is pushed (e.g. v1.0.0)

permissions:
  contents: write # Required to upload assets to GitHub Releases

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js (build static frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build Static Files
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          cd frontend
          npm ci
          npx prisma db push --schema=../prisma/schema.prisma --accept-data-loss
          npm run build # Next.js outputs to frontend/out

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
